# ==============================
# AZURE WEB APP CONFIGURATION
# ==============================
# This profile is activated on Azure deployment to route to public HTTPS endpoints
# instead of internal Eureka lb:// URIs (which are not routable between Web Apps without VNet)

spring.application.name=Gateway-Service
server.port=8090

# EUREKA (Azure - keep for health checks and service registry visibility)
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:https://fakarni-eureka.azurewebsites.net/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${WEBSITE_HOSTNAME:fakarni-gateway.azurewebsites.net}

# SECURITE JWT
security.jwt.secret=${JWT_SECRET}

# TAILLE MAX DES REQUETES
spring.codec.max-in-memory-size=50MB

# GATEWAY FILTER
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials RETAIN_FIRST

# ==============================
# AZURE PUBLIC HTTPS ROUTES
# ==============================
# Override lb:// with direct HTTPS URLs to Azure Web Apps

# User Service routes
gateway.routes.user-auth.uri=https://fakarni-user.azurewebsites.net
gateway.routes.user.uri=https://fakarni-user.azurewebsites.net

# Session Service routes
gateway.routes.session.uri=https://fakarni-session.azurewebsites.net

# Event Service routes
gateway.routes.event.uri=https://fakarni-event.azurewebsites.net

# Post Service routes
gateway.routes.post.uri=https://fakarni-post.azurewebsites.net

# Group Service routes
gateway.routes.group.uri=https://fakarni-group.azurewebsites.net

# Chat Service routes
gateway.routes.chat.uri=https://fakarni-chat.azurewebsites.net
gateway.routes.chat-ws.uri=wss://fakarni-chat.azurewebsites.net

# Meeting Insights Service routes
gateway.routes.meeting-insights.uri=https://fakarni-meeting.azurewebsites.net

# Activite Educative Service routes (direct URI)
gateway.direct.activite-educative-service-uri=https://fakarni-activite.azurewebsites.net

# ==============================
# HARDCODED ROUTES (need code modification to override)
# ==============================
# These routes are still lb:// in GatewayServiceApplication.java:
# - lb://Detection_Maladie-Service → needs @Value injection
# - lb://Dossier_Medical-Service → needs @Value injection
# - lb://SUIVI-ENGAGEMENT-SERVICE → needs @Value injection
# - lb://TRACKING-SERVICE → needs @Value injection
# - lb://GEOFENCING-SERVICE → needs @Value injection
#
# Workaround: Set environment variables on Azure Web App for Gateway-Service
# to override Eureka registration URLs (see azure-configure-gateway.ps1)

# LOGS
logging.level.org.springframework.cloud.gateway=INFO
logging.level.reactor.netty.http.client=INFO
logging.level.com.alzheimer.Gateway_Service=DEBUG
