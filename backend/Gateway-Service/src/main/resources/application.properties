spring.application.name=Gateway-Service
server.port=8090

# EUREKA (local)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# SECURITE JWT
security.jwt.secret=${JWT_SECRET}

# TAILLE MAX DES REQUETES
spring.codec.max-in-memory-size=50MB

# GATEWAY FILTER
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials RETAIN_FIRST

# CORS - Spring Cloud Gateway auto-registers its OWN CorsWebFilter (GlobalCorsProperties) in
# addition to our CorsConfig bean. Left unconfigured, that second filter finds no matching
# path and rejects some requests with 403 "Invalid CORS request", inconsistently across routes.
# Mirror the same allowed origins here so both filters agree instead of fighting each other.
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOriginPatterns[0]=http://localhost:[*]
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOriginPatterns[1]=https://localhost:[*]
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOriginPatterns[2]=https://*.app.github.dev
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].maxAge=3600

# LOGS
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG