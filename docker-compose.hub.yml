# Lance l'application depuis les images publiées sur Docker Hub (aucun build local, aucun Azure).
#   docker compose -f docker-compose.yml -f docker-compose.hub.yml pull <services>
#   docker compose -f docker-compose.yml -f docker-compose.hub.yml up -d --no-build <services>
# Variables optionnelles : DOCKERHUB_USERNAME (défaut yasserwahada25), IMAGE_TAG (défaut latest, ou un sha de commit).
services:
  eureka-server:
    image: ${DOCKERHUB_USERNAME:-yasserwahada25}/fakarni-eureka-service:${IMAGE_TAG:-latest}
    build: !reset null
  api-gateway:
    image: ${DOCKERHUB_USERNAME:-yasserwahada25}/fakarni-gateway-service:${IMAGE_TAG:-latest}
    build: !reset null
