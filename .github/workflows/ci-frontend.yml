name: "CI - Frontend Angular"

on:
  push:
    paths:
      - 'frontend/**'
    branches:
      - main
      - develop
  pull_request:
    paths:
      - 'frontend/**'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    name: "Build Angular + Docker Push"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: "Install dependencies"
        working-directory: frontend
        run: npm ci

      - name: "Build Angular (production)"
        working-directory: frontend
        run: npm run build -- --configuration=production
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: "Login Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Build & Push Docker image"
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fakarni-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/fakarni-frontend:${{ github.sha }}

      - name: "Build Summary"
        run: |
          echo "### Frontend Image Published" >> $GITHUB_STEP_SUMMARY
          echo "| Info | Valeur |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image latest | \`${{ secrets.DOCKERHUB_USERNAME }}/fakarni-frontend:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Image SHA | \`${{ secrets.DOCKERHUB_USERNAME }}/fakarni-frontend:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
