# CI - Post Service (Reseau social interne + MySQL)
name: "CI - Post Service"

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/Post-Service/**'
      - '.github/workflows/ci-post-service.yml'
      - '.github/workflows/ci-reusable.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/Post-Service/**'
  workflow_dispatch:
    inputs:
      reason:
        description: "Raison du declenchement manuel"
        required: false
        default: "Test manuel"

jobs:
  ci:
    uses: ./.github/workflows/ci-reusable.yml
    with:
      service-name: "Post Service"
      service-path: "backend/Post-Service"
      image-name: "fakarni-post-service"
      sonar-project-key: "fakarni-post-service"
      is-java: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
