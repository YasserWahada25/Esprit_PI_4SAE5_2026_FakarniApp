# CI - Group Service (Gestion groupes + MySQL)
name: "CI - Group Service"

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/group/**'
      - '.github/workflows/ci-group-service.yml'
      - '.github/workflows/ci-reusable.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/group/**'
  workflow_dispatch:
    inputs:
      reason:
        description: "Raison du declenchement manuel"
        required: false
        default: "Test manuel"

jobs:
  ci:
    uses: ./.github/workflows/ci-reusable.yml
    with:
      service-name: "Group Service"
      service-path: "backend/group"
      image-name: "fakarni-group-service"
      sonar-project-key: "fakarni-group-service"
      is-java: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
